<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全覽北歐四國・北角日不落 15 日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #6b6560;
    --hint: #a09890;
    --blue: #1a4a7a;
    --blue-light: #e8f0f8;
    --blue-mid: #b8d0e8;
    --green: #2d6a4f;
    --green-light: #e8f4ef;
    --star-bg: #e8f0f8;
    --star: #1a4a7a;
    --heritage-bg: #e8f4ef;
    --heritage: #2d6a4f;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: var(--blue);
    color: white;
    padding: 2.5rem 1.5rem 2rem;
    text-align: center;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 0.85rem;
    opacity: 0.75;
    letter-spacing: 0.08em;
  }

  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: white;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .legend-item { display: flex; align-items: center; gap: 5px; }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    display: inline-block;
  }
  .badge.star { background: var(--star-bg); color: var(--star); }
  .badge.dot { background: #f0ede8; color: var(--muted); }
  .badge.heritage { background: var(--heritage-bg); color: var(--heritage); }

  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .day-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

  .day-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .day-header:hover { background: #faf8f5; }

  .day-num {
    background: var(--blue-light);
    color: var(--blue);
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    white-space: nowrap;
    min-width: 46px;
    text-align: center;
    flex-shrink: 0;
  }

  .day-date {
    font-size: 12px;
    color: var(--blue);
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .flag { font-size: 14px; flex-shrink: 0; }

  .day-title-wrap { flex: 1; min-width: 0; }

  .day-zh {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }

  .day-en {
    font-size: 11px;
    color: var(--hint);
    margin-top: 1px;
  }

  .day-country {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .chevron {
    font-size: 10px;
    color: var(--hint);
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .chevron.open { transform: rotate(90deg); }

  .day-body {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid var(--border);
  }

  .day-body.open { display: block; }

  .section { margin-top: 12px; }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--hint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .spots { display: flex; flex-direction: column; gap: 8px; }

  .spot-item { display: flex; flex-direction: column; gap: 4px; }

  .spot-tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    line-height: 1.5;
    max-width: fit-content;
  }

  .spot-tag.star { background: var(--star-bg); color: var(--star); }
  .spot-tag.heritage { background: var(--heritage-bg); color: var(--heritage); }
  .spot-tag.dot { background: #f0ede8; color: var(--text); border: 1px solid var(--border); }

  .link-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    padding-left: 4px;
  }

  .link-btn {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--muted);
    background: white;
    transition: all 0.15s;
  }

  .link-btn:hover {
    background: var(--bg);
    color: var(--text);
    border-color: var(--hint);
  }

  .link-btn.official {
    background: var(--blue-light);
    color: var(--blue);
    border-color: var(--blue-mid);
  }

  .link-btn.official:hover {
    background: var(--blue-mid);
  }

  .meal-row {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .meal-item { display: flex; gap: 5px; align-items: center; }
  .meal-label { font-weight: 500; color: var(--hint); font-size: 11px; }

  .hotel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    padding: 8px 11px;
    background: #faf8f5;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--blue-mid);
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--hint);
  }

  /* 特產區塊 */
  .shopping-section {
    margin-top: 12px;
    background: #fffdf7;
    border: 1px solid #e8dfc8;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .shopping-title {
    font-size: 11px;
    font-weight: 500;
    color: #8a6c2a;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .shopping-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .shopping-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .shopping-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
  }

  .shopping-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  .shopping-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-right: 3px;
    margin-bottom: 2px;
  }

  .tag-food { background: #fef3e2; color: #9a5c00; border: 1px solid #f5d9a0; }
  .tag-brand { background: #e8f0f8; color: #1a4a7a; border: 1px solid #b8d0e8; }
  .tag-souvenir { background: #f0edf8; color: #5a3a8a; border: 1px solid #cfc0e8; }
  .tag-beauty { background: #fce8f0; color: #8a2a50; border: 1px solid #e8b0c8; }

  /* 班機時刻表 */
  .flight-section {
    margin-top: 12px;
    border: 1px solid #dde8f4;
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .flight-header {
    background: #1a4a7a;
    color: white;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .flight-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .flight-table th {
    background: #e8f0f8;
    color: #1a4a7a;
    font-size: 10px;
    font-weight: 500;
    padding: 5px 10px;
    text-align: left;
    letter-spacing: 0.04em;
    border-bottom: 1px solid #dde8f4;
  }
  .flight-table td {
    padding: 8px 10px;
    color: var(--text);
    border-bottom: 1px solid #f0f4f8;
    vertical-align: middle;
  }
  .flight-table tr:last-child td { border-bottom: none; }
  .flight-no {
    font-weight: 500;
    color: #1a4a7a;
    font-size: 13px;
  }
  .flight-time {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .flight-city {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }
  .flight-arrow {
    color: var(--hint);
    font-size: 14px;
    padding: 0 4px;
  }
  .flight-dur {
    font-size: 11px;
    color: var(--muted);
    background: #f7f5f0;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .flight-label {
    font-size: 10px;
    background: #1a4a7a;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
</style>

<body>

<header>
  <h1>全覽北歐四國・北角日不落 15 日</h1>
  <p>7/19 – 8/2, 2026 ・ 行健旅遊 UNO TOUR</p>
</header>

<div class="legend">
  <div class="legend-item"><span class="badge star">★ 必訪</span> 重點景點（含門票）</div>
  <div class="legend-item"><span class="badge dot">◎ 參觀</span> 下車參觀</div>
  <div class="legend-item"><span class="badge heritage">🏛 UNESCO</span> 世界遺產</div>
  <div class="legend-item" style="border-left:1px solid #e2ddd6;padding-left:12px;color:#8a6c2a">🛒 特產推薦：展開每天可見</div>
</div>

<!-- 即時匯率區塊 -->
<div style="max-width:800px;margin:1.2rem auto 0;padding:0 1rem">
  <div id="rate-card" style="background:#fff;border:1px solid #e2ddd6;border-radius:12px;overflow:hidden">
    <div style="background:#1a4a7a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
      <div style="color:white;font-size:14px;font-weight:500">💱 北歐四國貨幣 × 台幣即時匯率</div>
      <button onclick="fetchRates()" id="refresh-btn"
        style="background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:20px;font-size:11px;padding:4px 12px;cursor:pointer">
        ↻ 更新匯率
      </button>
    </div>
    <div id="rate-body" style="padding:12px 16px">
      <div style="color:#a09890;font-size:12px;text-align:center;padding:8px">載入中...</div>
    </div>
    <div id="rate-footer" style="padding:6px 16px 10px;font-size:10px;color:#a09890;border-top:1px solid #f0ede8"></div>
  </div>
</div>

<script>
const CURRENCIES = [
  { code: 'SEK', name: '瑞典克朗', symbol: 'kr', flag: '🇸🇪', days: 'Day 2–3', color: '#2D6FA3' },
  { code: 'EUR', name: '歐元（芬蘭）', symbol: '€', flag: '🇫🇮', days: 'Day 3–5', color: '#0B6B4A' },
  { code: 'NOK', name: '挪威克朗', symbol: 'kr', flag: '🇳🇴', days: 'Day 6–11', color: '#C0392B' },
  { code: 'DKK', name: '丹麥克朗', symbol: 'kr', flag: '🇩🇰', days: 'Day 11–14', color: '#8B2252' },
];

const QUICK_AMOUNTS = [1, 10, 50, 100, 500, 1000];

async function fetchRates() {
  const btn = document.getElementById('refresh-btn');
  const body = document.getElementById('rate-body');
  const footer = document.getElementById('rate-footer');
  btn.textContent = '載入中...';
  btn.disabled = true;

  try {
    // 三重備援匯率來源（1 TWD = ? 外幣）
    let rates = null;

    try {
      const r = await fetch('https://api.frankfurter.app/latest?from=TWD&to=SEK,EUR,NOK,DKK');
      if (r.ok) { const d = await r.json(); rates = d.rates; }
    } catch(e) {}

    if (!rates) {
      try {
        const r = await fetch('https://latest.currency-api.pages.dev/v1/currencies/twd.json');
        if (r.ok) { const d = await r.json(); const t = d.twd; rates = {SEK:t.sek, EUR:t.eur, NOK:t.nok, DKK:t.dkk}; }
      } catch(e) {}
    }

    if (!rates) {
      try {
        const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json');
        if (r.ok) { const d = await r.json(); const t = d.twd; rates = {SEK:t.sek, EUR:t.eur, NOK:t.nok, DKK:t.dkk}; }
      } catch(e) {}
    }

    if (!rates) throw new Error('無法取得匯率，請確認網路連線後重試');

    let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px">';

    CURRENCIES.forEach(cur => {
      const ratePerForeign = 1 / rates[cur.code]; // 1 外幣 = ? TWD
      const ratePerTWD100 = (100 * rates[cur.code]).toFixed(2); // 100 TWD = ? 外幣

      // 快速換算表
      const quickRows = QUICK_AMOUNTS.map(amt => {
        const twd = (amt * ratePerForeign).toFixed(1);
        return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f5f3ef">
          <span style="color:#6b6560">${cur.symbol}${amt}</span>
          <span style="font-weight:500;color:#1a1814">≈ NT$ ${Number(twd).toLocaleString()}</span>
        </div>`;
      }).join('');

      html += `
        <div style="border:1px solid #e8e4de;border-radius:8px;overflow:hidden">
          <div style="background:${cur.color};padding:8px 12px;display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:18px">${cur.flag}</span>
              <div>
                <div style="color:white;font-size:13px;font-weight:500">${cur.name} (${cur.code})</div>
                <div style="color:rgba(255,255,255,0.7);font-size:10px">${cur.days}</div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="color:white;font-size:18px;font-weight:600">NT$ ${ratePerForeign.toFixed(2)}</div>
              <div style="color:rgba(255,255,255,0.7);font-size:10px">= 1 ${cur.code}</div>
            </div>
          </div>
          <div style="padding:8px 12px;background:#fafaf8">
            <div style="font-size:10px;color:#a09890;margin-bottom:5px;letter-spacing:0.04em">快速換算</div>
            ${quickRows}
            <div style="display:flex;justify-content:space-between;padding:4px 0;margin-top:2px">
              <span style="color:#6b6560;font-size:11px">NT$ 100</span>
              <span style="font-weight:500;font-size:11px;color:#1a4a7a">≈ ${cur.symbol} ${ratePerTWD100}</span>
            </div>
          </div>
          <div style="padding:6px 12px 8px">
            <div style="font-size:10px;color:#a09890;margin-bottom:4px">自訂金額</div>
            <div style="display:flex;gap:6px;align-items:center">
              <span style="color:#6b6560;font-size:12px">${cur.symbol}</span>
              <input type="number" placeholder="輸入${cur.code}金額" oninput="calcTWD(this, ${ratePerForeign})"
                style="flex:1;border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:12px;outline:none;min-width:0">
              <span style="color:#a09890;font-size:12px">=</span>
              <span class="twd-result-${cur.code}"
                style="color:#1a4a7a;font-weight:500;font-size:13px;min-width:60px;text-align:right">NT$ —</span>
            </div>
          </div>
        </div>`;
    });

    html += '</div>';
    body.innerHTML = html;

    const now = new Date();
    footer.textContent = `匯率更新時間：${now.toLocaleDateString('zh-TW')} ${now.toLocaleTimeString('zh-TW')} ・資料來源：Frankfurter API（歐洲央行）`;
    btn.textContent = '↻ 更新匯率';
    btn.disabled = false;

  } catch(e) {
    body.innerHTML = '<div style="color:#c0392b;font-size:12px;text-align:center;padding:12px">匯率載入失敗，請檢查網路連線後重試。</div>';
    btn.textContent = '↻ 重試';
    btn.disabled = false;
  }
}

function calcTWD(input, rate) {
  const val = parseFloat(input.value);
  // 找對應的 result span
  const allInputs = document.querySelectorAll('input[type=number]');
  const allResults = [];
  CURRENCIES.forEach(c => {
    const el = document.querySelector('.twd-result-' + c.code);
    if (el) allResults.push(el);
  });
  const idx = Array.from(allInputs).indexOf(input);
  if (idx >= 0 && allResults[idx]) {
    if (isNaN(val) || val === '') {
      allResults[idx].textContent = 'NT$ —';
    } else {
      allResults[idx].textContent = 'NT$ ' + (val * rate).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
  }
}

// 頁面載入時自動抓取
fetchRates();
</script>

function renderHotel(hotelStr) {
  if (!hotelStr || hotelStr === '夜宿機上' || hotelStr === '—') {
    return `<span style="color:var(--muted)">${hotelStr}</span>`;
  }
  // 以 ／ 分割各飯店
  const parts = hotelStr.split('／');
  return parts.map(part => {
    part = part.trim();
    // 找對應連結
    let url = null;
    const partUpper = part.toUpperCase();
    for (const [key, link] of Object.entries(hotelLinks)) {
      if (partUpper.includes(key.toUpperCase())) {
        url = link;
        break;
      }
    }
    if (url) {
      return `<a href="${url}" target="_blank" style="color:var(--blue);text-decoration:none;font-size:12px;display:inline-flex;align-items:center;gap:3px">${part}<span style="font-size:10px;opacity:0.7">↗</span></a>`;
    }
    return `<span style="font-size:12px">${part}</span>`;
  }).join('<span style="color:var(--hint);margin:0 4px">／</span>');
}
