const tagLabels = { food: "🍴 食物", brand: "🛍 品牌", souvenir: "🎁 紀念品", beauty: "✨ 保養" };

function render() {
  const app = document.getElementById('app');
  app.innerHTML = days.map((d, i) => {
    const date = getDate(2026, 7, 19, d.n - 1);
    const dateStr = fmt(date);

    let spotHTML = '';
    if (d.spots && d.spots.length) {
      const items = d.spots.map(s => {
        const cls = `spot-tag ${s.type}`;
        const linksHTML = s.links && s.links.length
          ? `<div class="link-row">${s.links.map(l =>
              `<a class="link-btn${l.o ? ' official' : ''}" href="${l.u}" target="_blank">${l.t} ↗</a>`
            ).join('')}</div>`
          : '';
        return `<div class="spot-item"><span class="${cls}">${s.n}</span>${linksHTML}</div>`;
      }).join('');
      spotHTML = `<div class="section"><div class="section-label">景點 &amp; 連結</div><div class="spots">${items}</div></div>`;
    }

    const noteHTML = d.note
      ? `<div class="note">${d.note}</div>`
      : '';

    // 特產區塊
    const shopItems = dayShoppingMap[d.n];
    let shopHTML = '';
    if (shopItems && shopItems.length) {
      const items = shopItems.map(s => `
        <div class="shopping-item">
          <div class="shopping-name">
            <span class="shopping-tag tag-${s.tag}">${tagLabels[s.tag]}</span>${s.name}
          </div>
          <div class="shopping-desc">${s.desc}</div>
        </div>`).join('');
      shopHTML = `<div class="shopping-section">
        <div class="shopping-title">🛒 當地特產 &amp; 購物推薦</div>
        <div class="shopping-grid">${items}</div>
      </div>`;
    }

    return `<div class="day-card">
      <div class="day-header" onclick="tog(${i})">
        <span class="day-num">Day ${d.n}</span>
        <span class="day-date">${dateStr}</span>
        <span class="flag">${d.flag}</span>
        <div class="day-title-wrap">
          <div class="day-zh">${d.zh}</div>
          <div class="day-en">${d.en}</div>
        </div>
        <span class="day-country">${d.country}</span>
        <span class="chevron" id="ch${i}">▶</span>
      </div>
      <div class="day-body" id="bd${i}">
        ${spotHTML}
        <div class="section">
          <div class="section-label">餐食</div>
          <div class="meal-row">
            <div class="meal-item"><span class="meal-label">早</span>${d.meals['早']}</div>
            <div class="meal-item"><span class="meal-label">午</span>${d.meals['午']}</div>
            <div class="meal-item"><span class="meal-label">晚</span>${d.meals['晚']}</div>
          </div>
        </div>
        <div class="section">
          <div class="section-label">住宿</div>
          <div class="hotel">${d.hotel}</div>
        </div>
        ${shopHTML}
        ${noteHTML}
      </div>
    </div>`;
  }).join('');
}

function tog(i) {
  document.getElementById('bd' + i).classList.toggle('open');
  document.getElementById('ch' + i).classList.toggle('open');
}

render();
